<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<style>
:root{--bg:#0b0d10;--card:#151920;--card2:#1d232c;--line:#2a313c;--txt:#eef1f5;--mut:#8b95a5;--acc:#ff3b30;--acc2:#ffc400;--ok:#2ecc71}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,select,input{font:inherit;color:inherit}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));max-width:760px;margin:0 auto}
.logo{display:flex;align-items:baseline;gap:8px}
.logo b{font-weight:900;font-style:italic;font-size:22px;letter-spacing:1px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{color:var(--mut);font-size:12px}
header select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
main{max-width:760px;margin:0 auto;padding:0 12px}
#viewer{position:sticky;top:0;z-index:5;background:var(--bg);padding-bottom:8px}
#stageWrap{position:relative;height:40vh;min-height:220px;background:#000;border-radius:16px;overflow:hidden}
#stage,#src{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#src{display:none}
#viewer.src #src{display:block}#viewer.src #stage{display:none}
#transport{display:flex;align-items:center;gap:10px;margin-top:8px}
#transport .time{color:var(--mut);font-variant-numeric:tabular-nums;font-size:13px;flex:1;text-align:right}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600}
.btn:active{transform:scale(.97)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.gold{background:var(--acc2);border-color:var(--acc2);color:#111}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.panel{display:none;padding:4px 0 20px}
.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.card h3{margin:0 0 10px;font-size:15px}
.hint{color:var(--mut);font-size:13px;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row>label{color:var(--mut);font-size:13px;min-width:90px}
.field{margin:10px 0}
.field>label{display:block;color:var(--mut);font-size:13px;margin-bottom:5px}
input[type=text],input[type=number],select.inp{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input[type=text]:focus{border-color:var(--acc2)}
input[type=color]{width:46px;height:42px;border:none;border-radius:10px;background:none;padding:0}
input[type=range]{width:100%;accent-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tog{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.tog:last-child{border-bottom:none}
.tog input{width:46px;height:26px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:20px;position:relative;cursor:pointer;transition:.2s}
.tog input:checked{background:var(--acc)}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tog input:checked::after{left:23px}
.clip,.mom{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:8px;margin:8px 0}
.clip.sel{border-color:var(--acc2)}
.clip img,.mom img{width:84px;height:48px;object-fit:cover;border-radius:8px;background:#000;flex:none}
.clip .info,.mom .info{flex:1;min-width:0}
.clip .nm,.mom .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip .sub,.mom .sub{color:var(--mut);font-size:12px}
.mom .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--line);color:var(--txt)}
.tag.r{background:var(--acc)}.tag.g{background:var(--acc2);color:#111}
.icon{background:none;border:none;font-size:18px;padding:6px;cursor:pointer;color:var(--mut)}
#markBtn{width:100%;font-size:22px;font-weight:900;font-style:italic;letter-spacing:1px;padding:16px;border-radius:16px;background:linear-gradient(90deg,var(--acc),#ff6a00);border:none;color:#fff;box-shadow:0 6px 24px rgba(255,59,48,.35)}
#markBtn.hit{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.05);filter:brightness(1.4)}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .2s}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:rgba(11,13,16,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(10px)}
nav#tabs button{flex:1;max-width:150px;background:none;border:none;color:var(--mut);padding:9px 2px 10px;font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav#tabs button span{font-size:20px;line-height:1}
nav#tabs button.on{color:var(--txt)}
nav#tabs button.on span{filter:drop-shadow(0 0 6px var(--acc))}
.modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.55)}
.modal.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:78vh;overflow:auto;background:var(--bg);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.sheet .grab{width:44px;height:5px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.sheet h2{margin:0 0 4px;font-size:18px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper b{flex:1;text-align:center;font-variant-numeric:tabular-nums;font-size:15px}
.stepper button{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:13px;font-weight:700;cursor:pointer;min-width:44px}
#mvBox{background:#000;border-radius:12px;overflow:hidden;height:22vh;margin:8px 0}
#mvBox video{width:100%;height:100%;object-fit:contain}
#draw{background:#000}
#draw .wrap{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#dcBox{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px}
#dc{touch-action:none;border-radius:8px;background:#111}
.dtools{padding:8px 10px;background:var(--bg);border-top:1px solid var(--line);max-height:46vh;overflow:auto}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex:none}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#fff;color:#111;font-weight:600;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#result video{width:100%;max-height:50vh;background:#000;border-radius:12px}
#bin{position:fixed;left:0;top:0;width:2px;height:2px;overflow:hidden;opacity:.01;pointer-events:none}
#bin video{width:2px;height:2px}
.foot{color:var(--mut);font-size:11px;text-align:center;margin:16px 0 0}
</style>
</head>

<header>
  <div class="logo"><b>РАУНД</b><small data-i="tagline"></small></div>

</header>
<main>

      <button class="btn sm acc" id="playBtn"></button>
      <span class="time" id="timeLbl"></span>
    </div>
  </section>
  <section id="panels">
    <div class="panel" id="p-clips"></div>
    <div class="panel" id="p-moments"></div>
    <div class="panel" id="p-board"></div>
    <div class="panel" id="p-style"></div>
    <div class="panel" id="p-export"></div>
  </section>
</main>
<nav id="tabs">
  <button data-tab="clips"><span>🎬</span><em data-i="tab_clips"></em></button>
  <button data-tab="moments"><span>⚡</span><em data-i="tab_moments"></em></button>
  <button data-tab="board"><span>🥊</span><em data-i="tab_board"></em></button>
  <button data-tab="style"><span>🎨</span><em data-i="tab_style"></em></button>
  <button data-tab="export"><span>⬇️</span><em data-i="tab_export"></em></button>
</nav>
<div class="modal" id="sheet"><div class="sheet" id="sheetBody"></div></div>
<div class="modal" id="draw"><div class="wrap"><div id="dcBox"><canvas id="dc"></canvas></div><div class="dtools" id="dtools"></div></div></div>
<div id="toast"></div>
<div id="bin"></div>
<input type="file" id="fVideo" accept="video/*" multiple hidden>
<input type="file" id="fMusic" accept="audio/*" hidden>
<input type="file" id="fLogo" accept="image/*" hidden>

/* ================= clips ================= */
function probe(url){return new Promise(res=>{const v=mkVideo();v.src=url;let done=false;
  const fin=o=>{if(done)return;done=true;v.removeAttribute('src');v.load();v.remove();res(o)};
  v.onloadedmetadata=()=>{const d=isFinite(v.duration)?v.duration:0;v.currentTime=Math.min(1,d/3)};
  v.onseeked=()=>fin({dur:isFinite(v.duration)?v.duration:0,w:v.videoWidth,h:v.videoHeight,thumb:grab(v,160)});
  v.onerror=()=>fin({dur:0,w:1280,h:720,thumb:'',err:true});
  setTimeout(()=>fin({dur:isFinite(v.duration)?v.duration:0,w:v.videoWidth||1280,h:v.videoHeight||720,thumb:''}),9000)})}
async function addFiles(files){
  for(const f of files){
    if(!(f.type||'').startsWith('video')&&!/\.(mp4|mov|webm|m4v|mkv|3gp)$/i.test(f.name))continue;
    const url=URL.createObjectURL(f);const meta=await probe(url);
    const c={id:uid(),name:f.name,key:f.name+'|'+f.size,url,dur:meta.dur,w:meta.w||1280,h:meta.h||720,thumb:meta.thumb};
    S.clips.push(c);
    const mine=pending.filter(m=>m.clipKey===c.key);
    if(mine.length){
      pending=pending.filter(m=>m.clipKey!==c.key);
      mine.forEach(m=>{const mm=Object.assign({},m,{id:uid(),clip:c.id});delete mm.clipKey;
        if(mm.cmp){const cc=S.clips.find(x=>x.key===mm.cmp.key);if(cc)mm.cmp=Object.assign({},mm.cmp,{clip:cc.id});else mm.cmp=null}
        S.moments.push(mm);makeThumb(mm)});
      toast(t('restored')+' '+mine.length);
    }
    if(!S.cur)selectClip(c.id);
  }
  renderClips();renderMoments();persist();idleSoon();
}
function selectClip(id){S.cur=id;const c=clipById(id);const v=$('#src');if(c&&v.dataset.cid!==id){v.src=c.url;v.dataset.cid=id}renderClips();renderMoments()}
function delClip(id){const c=clipById(id);if(!c)return;
  S.moments=S.moments.filter(m=>m.clip!==id);S.moments.forEach(m=>{if(m.cmp&&m.cmp.clip===id)m.cmp=null});
  Object.keys(pool).forEach(k=>{if(k.startsWith(id+':')){pool[k].remove();delete pool[k]}});
  S.clips=S.clips.filter(x=>x.id!==id);URL.revokeObjectURL(c.url);
  if(S.cur===id){S.cur=null;const v=$('#src');v.removeAttribute('src');v.dataset.cid='';v.load();if(S.clips[0])selectClip(S.clips[0].id)}
  renderClips();renderMoments();persist();idleSoon()}

const thumbQ=[];let thumbBusy=false,thumbV=null;
function makeThumb(m){thumbQ.push(m);runThumbs()}
async function runThumbs(){if(thumbBusy)return;thumbBusy=true;if(!thumbV)thumbV=mkVideo();const v=thumbV;
  while(thumbQ.length){const m=thumbQ.shift();const c=clipById(m.clip);if(!c)continue;
    if(v.src!==c.url){v.src=c.url;await once(v,'loadeddata',5000)}
    await seekTo(v,m.hit!=null?m.hit:(m.a+m.b)/2);m.thumb=grab(v,160);renderMoments()}
  thumbBusy=false}

/* ================= moments ================= */
function newMoment(clip,a,b,hit){return{id:uid(),clip,a:r4(a),b:r4(b),hit:r4(hit),replay:'slow',freeze:null,caption:'',flash:'',point:'',cmp:null}}
function markMoment(){
  const v=$('#src');const c=clipById(S.cur);if(!c)return toast(t('needClip'));
  const tt=v.currentTime,dur=c.dur||v.duration||tt+5;
  const a=Math.max(0,tt-S.cfg.before),b=Math.min(dur,tt+S.cfg.after);
  if(b-a<0.3)return;
  const m=newMoment(c.id,a,b,tt);m.thumb=grab(v,160);S.moments.push(m);
  renderMoments();persist();idleSoon();
  const btn=$('#markBtn');btn.classList.remove('hit');void btn.offsetWidth;btn.classList.add('hit');
  if(navigator.vibrate)navigator.vibrate(30);
  toast(t('marked')+' · '+fmt(tt));
}
function hitOf(m){return clamp(m.hit!=null?m.hit:m.b-S.cfg.after,m.a,m.b)}

/* ---- auto find by motion ---- */
let autoStop=null;
async function autoFind(){
  const c=clipById(S.cur);if(!c)return toast(t('needClip'));
  const n=+$('#autoN').value||5;
  const box=$('#autoBox');box.innerHTML='<div class="hint">'+t('autoBusy')+'</div><div class="prog"><i id="autoP"></i></div><button class="btn sm" id="autoCancel">'+t('cancel')+'</button>';
  $('#autoCancel').onclick=()=>autoStop&&autoStop();
  const v=mkVideo();v.src=c.url;await once(v,'loadeddata',8000);
  const dur=c.dur||v.duration||0;
  const cv=document.createElement('canvas');cv.width=48;cv.height=27;const x=cv.getContext('2d',{willReadFrequently:true});
  let prev=null,prevT=0,stop=false;const samples=[];autoStop=()=>{stop=true};
  try{v.playbackRate=4}catch(e){try{v.playbackRate=2}catch(e2){}}
  await v.play().catch(()=>{});
  await new Promise(res=>{
    let last=-1;
    const step=()=>{
      if(stop||v.ended||(dur&&v.currentTime>=dur-0.05)){res();return}
      const ct=v.currentTime;
      if(ct!==last){last=ct;
        try{x.drawImage(v,0,0,48,27);const d=x.getImageData(0,0,48,27).data;const g=new Uint8Array(48*27);
          for(let i=0,j=0;i<d.length;i+=4,j++)g[j]=(d[i]*3+d[i+1]*6+d[i+2])/10;
          if(prev){let s=0;for(let j=0;j<g.length;j++)s+=Math.abs(g[j]-prev[j]);const dt=Math.max(ct-prevT,0.03);if(dt<1)samples.push([ct,s/g.length/dt])}
          prev=g;prevT=ct}catch(e){}
        const p=$('#autoP');if(p&&dur)p.style.width=(ct/dur*100)+'%'}
      requestAnimationFrame(step)};
    v.onended=()=>res();requestAnimationFrame(step)});
  v.pause();v.remove();autoStop=null;renderAuto();renderMoments();
  if(stop)return;
  if(samples.length<8)return toast(t('autoFail'));
  // smooth over ~1s
  const sm=samples.map(([tt],i)=>{let s=0,k=0;for(let j=i;j>=0&&samples[j][0]>tt-0.6;j--){s+=samples[j][1];k++}for(let j=i+1;j<samples.length&&samples[j][0]<tt+0.6;j++){s+=samples[j][1];k++}return[tt,s/k]});
  const sep=Math.max(5,S.cfg.before+S.cfg.after+1);
  const order=sm.slice().sort((p,q)=>q[1]-p[1]);const pick=[];
  for(const p of order){if(pick.length>=n)break;if(pick.every(q=>Math.abs(q[0]-p[0])>=sep))pick.push(p)}
  pick.sort((p,q)=>p[0]-q[0]);
  pick.forEach(p=>{const tt=p[0];const m=newMoment(c.id,Math.max(0,tt-S.cfg.before),Math.min(dur,tt+S.cfg.after),tt);S.moments.push(m);makeThumb(m)});
  renderMoments();persist();idleSoon();toast(t('autoDone')+' '+pick.length);
}

/* ================= audio ================= */
let AC=null,master=null,spk=null,recDest=null;
function ensureAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  try{AC=new C();master=AC.createGain();spk=AC.createGain();master.connect(spk);spk.connect(AC.destination);
    recDest=AC.createMediaStreamDestination?AC.createMediaStreamDestination():null;if(recDest)master.connect(recDest);
    Object.values(pool).forEach(routeAudio);if(music)routeAudio(music)}catch(e){AC=null}
}
function routeAudio(el){if(!AC||el._g)return;try{const s=AC.createMediaElementSource(el);const g=AC.createGain();g.gain.value=0;s.connect(g);g.connect(master);el._g=g;el.muted=false}catch(e){}}
function setG(el,val){if(el._g){el._g.gain.value=val;el.muted=false}else el.muted=val<=0}

/* ================= engine ================= */
const pool={};
function vid(clipId,slot){const k=clipId+':'+slot;if(pool[k])return pool[k];const c=clipById(clipId);const v=mkVideo();v.src=c.url;pool[k]=v;routeAudio(v);setG(v,0);return v}
function outDims(short,cfg){
  cfg=cfg||S.cfg;let ar;
  switch(cfg.aspect){case'16:9':ar=16/9;break;case'1:1':ar=1;break;case'4:5':ar=4/5;break;case'source':{const c=S.clips[0];ar=c?c.w/c.h:16/9;break}default:ar=9/16}
  let W,H;if(ar>=1){H=short;W=Math.round(short*ar)}else{W=short;H=Math.round(short/ar)}
  return{W:W&~1,H:H&~1};
}
function buildPlan(only){
  const cfg=S.cfg,P=[];
  const ms=only?S.moments.filter(m=>m.id===only&&clipById(m.clip)):S.moments.filter(m=>clipById(m.clip));
  if(!only&&cfg.intro)P.push({k:'card',kind:'intro',dur:2.8});
  let sr=+cfg.scoreR||0,sb=+cfg.scoreB||0;
  ms.forEach((m,idx)=>{
    const passes=[{rate:1,replay:false}];
    if(m.replay==='slow')passes.push({rate:.5,replay:true});
    if(m.replay==='super')passes.push({rate:.25,replay:true});
    const fp=m.freeze?passes.length-1:-1;const hit=hitOf(m);
    const base={m,sr,sb,idx,hit};const steps=[];
    const ft=m.freeze?m.freeze.t:hit;
    const ra=Math.max(m.a,Math.min(hit,ft)-1.6),rb=Math.min(m.b,Math.max(hit,ft)+1.2);
    passes.forEach((ps,pi)=>{
      const f=m.freeze,A=pi===0?m.a:ra,B=pi===0?m.b:Math.max(rb,ra+0.5);
      if(pi===fp&&f.t>A+0.05&&f.t<B-0.05){
        steps.push(Object.assign({k:'play',from:A,to:f.t,rate:ps.rate,replay:ps.replay,pi},base));
        steps.push(Object.assign({k:'freeze',at:f.t,dur:f.dur||2,replay:ps.replay,pi},base));
        steps.push(Object.assign({k:'play',from:f.t,to:B,rate:ps.rate,replay:ps.replay,pi,cont:true},base));
      }else if(pi===fp){
        steps.push(Object.assign({k:'play',from:A,to:B,rate:ps.rate,replay:ps.replay,pi},base));
        steps.push(Object.assign({k:'freeze',at:B,dur:f.dur||2,replay:ps.replay,pi,tail:true},base));
      }else steps.push(Object.assign({k:'play',from:A,to:B,rate:ps.rate,replay:ps.replay,pi},base));
    });
    steps.forEach((s,i)=>{s.first=i===0;s.last=i===steps.length-1;s.passStart=!s.cont&&s.k==='play'&&(i===0||steps[i-1].pi!==s.pi);s.passEnd=i===steps.length-1||steps[i+1].pi!==s.pi});
    P.push(...steps);
    if(m.point==='red')sr++;if(m.point==='blue')sb++;
  });
  if(!only&&cfg.outro)P.push({k:'card',kind:'outro',dur:2.8,sr,sb});
  for(let i=0;i<P.length;i++){P[i].next=P[i+1]||null}
  return P;
}
const stepDur=s=>s.k==='play'?(s.to-s.from)/s.rate:s.dur;
const slotOf=s=>String(s.idx%2);
let run=null;
function loop(fn,R){return new Promise(res=>{const f=()=>{if(R.stop){res();return}let go=false;try{go=fn()}catch(e){console.error(e)}if(go)requestAnimationFrame(f);else res()};requestAnimationFrame(f)})}
async function playPlan(plan,ctx,W,H,opts){
  const R={stop:false};run=R;
  const total=plan.reduce((s,x)=>s+stepDur(x),0)||0.01;let acc=0;
  if(music){try{music.currentTime=0}catch(e){}setG(music,S.cfg.musicVol);music.play().catch(()=>{})}
  for(const st of plan){
    if(R.stop)break;
    await runStep(st,ctx,W,H,R,l=>{const a=acc+l;opts.onProgress&&opts.onProgress(a/total,a,total);
      if(music&&music._g){const rest=total-a;music._g.gain.value=S.cfg.musicVol*clamp(rest/1.5,0,1)}});
    acc+=stepDur(st);
  }
  Object.values(pool).forEach(v=>{v.pause();setG(v,0)});
  if(music){music.pause()}
  if(run===R)run=null;
  return!R.stop;
}
function preseekNext(st,cur){
  let n=st.next;while(n&&n.k!=='play')n=n.next;
  if(!n||n.cont||n.m===st.m)return;
  const nv=vid(n.m.clip,slotOf(n));if(nv!==cur)ensureAt(nv,n.from);
  if(n.m.cmp&&clipById(n.m.cmp.clip)){const v2=vid(n.m.cmp.clip,'c'+slotOf(n));ensureAt(v2,n.m.cmp.a)}
}
async function runStep(st,ctx,W,H,R,tick){
  if(st.k==='card'){const t0=performance.now();
    if(st.kind==='intro')preseekNext(st,null);
    await loop(()=>{const l=(performance.now()-t0)/1000;drawCard(ctx,W,H,st,Math.min(l,st.dur));tick(Math.min(l,st.dur));return l<st.dur},R);return}
  const m=st.m,v=vid(m.clip,slotOf(st));
  const hasCmp=m.cmp&&clipById(m.cmp.clip);const v2=hasCmp?vid(m.cmp.clip,'c'+slotOf(st)):null;const off2=hasCmp?m.cmp.a-m.a:0;
  if(st.k==='freeze'){v.pause();if(v2)v2.pause();const t0=performance.now();
    await loop(()=>{const l=(performance.now()-t0)/1000;drawScene(ctx,W,H,st,v,v2,Math.min(l,st.dur));tick(Math.min(l,st.dur));return l<st.dur},R);return}
  if(!st.cont)await Promise.all([ensureAt(v,st.from),v2?ensureAt(v2,st.from+off2):null]);
  if(R.stop)return;
  setG(v,st.rate<1&&!S.cfg.slowAudio?0:S.cfg.origVol);if(v2)setG(v2,0);
  try{v.playbackRate=st.rate;if(v2)v2.playbackRate=st.rate}catch(e){}
  preseekNext(st,v);
  await v.play().catch(()=>{});if(v2)v2.play().catch(()=>{});
  const dur=stepDur(st);let lastT=-1,stuck=performance.now();
  await loop(()=>{const ct=v.currentTime;const l=clamp((ct-st.from)/st.rate,0,dur);
    drawScene(ctx,W,H,st,v,v2,l);tick(l);
    if(ct!==lastT){lastT=ct;stuck=performance.now()}
    if(performance.now()-stuck>4000)return false;
    if(v2&&!v2.seeking&&Math.abs((v2.currentTime-off2)-ct)>0.3){try{v2.currentTime=ct+off2}catch(e){}}
    return ct<st.to-0.01&&!v.ended},R);
  v.pause();if(v2)v2.pause();setG(v,0);
}

const FONT='"Arial Black","Helvetica Neue",Arial,sans-serif';

      font(ctx,U*0.1,900,true);ctx.fillStyle=cfg.redColor;ctx.textAlign='right';ctx.fillText(String(sr),W/2-U*0.06,y);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(':',W/2,y);ctx.fillStyle=cfg.blueColor;ctx.textAlign='left';ctx.fillText(String(sb),W/2+U*0.06,y);ctx.textAlign='center';
      ctx.fillStyle='#fff';const nm=((cfg.red||'')+'  ·  '+(cfg.blue||'')).toUpperCase();fitFont(ctx,nm,W*0.86,U*0.035,800);ctx.fillText(nm,W/2,y+U*0.09);ctx.globalAlpha=1;y+=U*0.18}
    if(cfg.cta){const a=ease((l-0.8)/0.4);ctx.globalAlpha=a;const px=fitFont(ctx,cfg.cta.toUpperCase(),W*0.7,U*0.05,900,true);const tw=ctx.measureText(cfg.cta.toUpperCase()).width;rr(ctx,W/2-tw/2-px,y-px,tw+px*2,px*2,px);ctx.fillStyle=cfg.redColor;ctx.fill();ctx.fillStyle='#fff';ctx.fillText(cfg.cta.toUpperCase(),W/2,y+px*0.05);ctx.globalAlpha=1}
    if(l<0.25){ctx.fillStyle='rgba(255,255,255,'+(1-l/0.25)*0.8+')';ctx.fillRect(0,0,W,H)}
    if(d-l<0.6){ctx.fillStyle='rgba(0,0,0,'+(1-(d-l)/0.6)+')';ctx.fillRect(0,0,W,H)}

function pickMime(){if(!window.MediaRecorder)return null;
  const c=['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  for(const m of c){try{if(MediaRecorder.isTypeSupported(m))return m}catch(e){}}return''}
let lastUrl=null;
async function doExport(){
  if(!S.moments.some(m=>clipById(m.clip)))return toast(t('noMoments'));
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)return toast(t('noRecorder'));
  if(run){run.stop=true;await sleep(80)}
  ensureAudio();$('#src').pause();
  const{W,H}=outDims(+S.cfg.res);const fps=+S.cfg.fps;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;cv.style.cssText='position:fixed;left:0;top:0;width:4px;height:4px;opacity:.01;pointer-events:none';document.body.appendChild(cv);
  const ctx=cv.getContext('2d',{alpha:false});ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const vs=cv.captureStream(fps);const tracks=vs.getVideoTracks();
  if(recDest)tracks.push(...recDest.stream.getAudioTracks());
  const stream=new MediaStream(tracks);const mime=pickMime();
  const br=Math.min(40e6,Math.round(W*H*fps*0.2));
  let mr;try{mr=new MediaRecorder(stream,Object.assign({videoBitsPerSecond:br,audioBitsPerSecond:192000},mime?{mimeType:mime}:{}))}catch(e){try{mr=new MediaRecorder(stream)}catch(e2){cv.remove();return toast(t('noRecorder'))}}
  const chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};const stopped=new Promise(r=>mr.onstop=r);
  let lock=null;try{lock=await navigator.wakeLock.request('screen')}catch(e){}
  const box=$('#expBox');box.innerHTML='<div class="hint">'+t('exporting')+'</div><div class="prog"><i id="expP"></i></div><div class="row"><span class="hint" id="expT" style="flex:1"></span><button class="btn sm" id="expCancel">'+t('cancel')+'</button></div>';
  $('#expCancel').onclick=()=>{if(run)run.stop=true};$('#expBtn').disabled=true;
  if(spk)spk.gain.value=0;
  sizeStage();const pc=$('#stage'),pctx=pc.getContext('2d');let fc=0;
  mr.start(1000);const tStart=performance.now();
  const plan=buildPlan();const pr=playPlan(plan,ctx,W,H,{onProgress:(p,a,tot)=>{const e=$('#expP');if(e)e.style.width=(p*100)+'%';const tl=$('#expT');if(tl)tl.textContent=fmt(a)+' / '+fmt(tot);if((fc++)%3===0)pctx.drawImage(cv,0,0,pc.width,pc.height)}});
  setPlayBtn();updateView();
  const ok=await pr;
  await sleep(150);mr.stop();await stopped;
  if(spk)spk.gain.value=1;vs.getVideoTracks().forEach(x=>x.stop());cv.remove();try{lock&&lock.release()}catch(e){}
  $('#expBtn').disabled=false;setPlayBtn();updateView();
  if(!ok){box.innerHTML='';return toast(t('cancelled'))}
  const type=(mr.mimeType||mime||'video/webm').split(';')[0];const blob=new Blob(chunks,{type});
  const ext=type.includes('mp4')?'mp4':'webm';const d=new Date();const name='raund-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'.'+ext;
  if(lastUrl)URL.revokeObjectURL(lastUrl);lastUrl=URL.createObjectURL(blob);
  const file=new File([blob],name,{type});const canShare=navigator.canShare&&navigator.canShare({files:[file]});
  box.innerHTML='<div id="result"><h3>'+t('result')+' <span class="hint">'+(blob.size/1048576).toFixed(1)+' MB · '+W+'×'+H+' · '+ext.toUpperCase()+'</span></h3><video src="'+lastUrl+'" controls playsinline></video><div class="row"><a class="btn acc" style="flex:1;text-align:center;text-decoration:none" href="'+lastUrl+'" download="'+name+'">'+t('download')+'</a>'+(canShare?'<button class="btn gold" style="flex:1" id="shareBtn">'+t('share')+'</button>':'')+'</div></div>';
  if(canShare)$('#shareBtn').onclick=()=>navigator.share({files:[file]}).catch(()=>{});
  window.__lastExport={size:blob.size,type,W,H,secs:(performance.now()-tStart)/1000,plan:plan.reduce((q,x)=>q+stepDur(x),0)};
}

    if(sb){const k=sb.parentElement.dataset.stp,d=+sb.dataset.d,dur=c.dur||m.b+10;
      if(k==='a'){m.a=r4(clamp(m.a+d,0,m.b-0.3));mv.currentTime=m.a}
      else if(k==='b'){m.b=r4(clamp(m.b+d,m.a+0.3,dur));mv.currentTime=m.b}
      else if(k==='hit'){m.hit=r4(clamp(hitOf(m)+d,m.a,m.b));mv.currentTime=m.hit}
      else if(k==='ca'){const c2=clipById(m.cmp.clip);m.cmp.a=r4(clamp(m.cmp.a+d,0,(c2&&c2.dur)||999))}
      if(m.freeze)m.freeze.t=clamp(m.freeze.t,m.a,m.b);
      upd();changed();return}
    const fl=e.target.closest('[data-fl]');if(fl){m.flash=fl.dataset.fl;$('#smFlash').value=m.flash;changed();return}
    const sg=e.target.closest('[data-seg^="m:"] button');if(sg){const key=sg.parentElement.dataset.seg.slice(2);m[key]=sg.dataset.v;$$('[data-seg="m:'+key+'"] button').forEach(b=>b.classList.toggle('on',b===sg));changed();return}
  };
  $('#smFlash').oninput=e=>{m.flash=e.target.value;changed()};
  $('#smCap').oninput=e=>{m.caption=e.target.value;changed()};
  $('#smCmp').onchange=e=>{const v=e.target.value;m.cmp=v?{clip:v,a:(m.cmp&&m.cmp.clip===v)?m.cmp.a:0,la:m.cmp?m.cmp.la:'',lb:m.cmp?m.cmp.lb:''}:null;renderCmp();changed()};
  $('#smDone').onclick=closeSheet;
  $('#smPlay').onclick=()=>{closeSheet();preview(m.id)};
  $('#smDraw').onclick=()=>openDraw(m);
  if($('#smUnfreeze'))$('#smUnfreeze').onclick=()=>{m.freeze=null;changed();openSheet(m.id)};
  $('#smDel').onclick=()=>{S.moments=S.moments.filter(x=>x!==m);closeSheet();changed()};
  const mvIdx=d=>{const j=S.moments.indexOf(m),k=j+d;if(k<0||k>=S.moments.length)return;S.moments.splice(j,1);S.moments.splice(k,0,m);changed();openSheet(m.id)};
  $('#smUp').onclick=()=>mvIdx(-1);$('#smDown').onclick=()=>mvIdx(1);
  $('#sheet').classList.add('on');
}
function closeSheet(){$('#sheet').classList.remove('on');const mv=$('#mv');if(mv){mv.removeAttribute('src');mv.load()}SM=null;renderMoments()}

/* ================= drawing editor ================= */
let DE=null;const COLORS=['#ffd400','#ff3b30','#1e90ff','#ffffff','#2ecc71'];
async function openDraw(m){
  const c=clipById(m.clip);const v=mkVideo();v.src=c.url;
  const f=m.freeze||{t:hitOf(m),dur:2,zoom:1.6,zx:.5,zy:.5,shapes:[]};
  DE={m,v,t:clamp(f.t,m.a,m.b),dur:f.dur,zoom:f.zoom,zx:f.zx,zy:f.zy,shapes:JSON.parse(JSON.stringify(f.shapes||[])),tool:'arrow',color:COLORS[0],cur:null};
  $('#draw').classList.add('on');renderDrawUI();
  await once(v,'loadeddata',6000);await seekTo(v,DE.t);sizeDC();drawDE();
}
function renderDrawUI(){
  const tools=[['arrow','➚ '+t('tArrow')],['circle','◯ '+t('tCircle')],['spot','◉ '+t('tSpot')],['line','╱ '+t('tLine')],['pen','✎ '+t('tPen')],['zoom','🎯 '+t('tZoom')]];
  const m=DE.m;
  $('#dtools').innerHTML='<p class="hint" style="margin-top:0">'+t('drawHint')+'</p>'+
    '<div class="seg" id="dTools">'+tools.map(x=>'<button data-tool="'+x[0]+'" class="'+(DE.tool===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</div>'+
    '<div class="row">'+COLORS.map(c=>'<span class="sw '+(DE.color===c?'on':'')+'" data-col="'+c+'" style="background:'+c+'"></span>').join('')+'<span style="flex:1"></span><button class="btn sm" id="dUndo">'+t('undo')+'</button><button class="btn sm" id="dClear">'+t('clear')+'</button></div>'+
    '<div class="field"><label>'+t('d_time')+': <b id="dTl"></b></label><input type="range" id="dT" min="'+m.a+'" max="'+m.b+'" step="0.033" value="'+DE.t+'"></div>'+
    '<div class="two"><div class="field"><label>'+t('d_dur')+': <b id="dDl"></b></label><input type="range" id="dD" min="0.8" max="5" step="0.1" value="'+DE.dur+'"></div>'+
    '<div class="field"><label>'+t('d_zoom')+': <b id="dZl"></b></label><input type="range" id="dZ" min="1" max="3" step="0.1" value="'+DE.zoom+'"></div></div>'+
    '<div class="row"><button class="btn" style="flex:1" id="dCancel">'+t('cancel')+'</button><button class="btn acc" style="flex:2" id="dSave">'+t('save')+'</button></div>';
  const lbl=()=>{$('#dTl').textContent=fmt(DE.t);$('#dDl').textContent=DE.dur.toFixed(1)+t('sec');$('#dZl').textContent=DE.zoom.toFixed(1)+'×'};lbl();
  $('#dTools').onclick=e=>{const b=e.target.closest('button');if(!b)return;DE.tool=b.dataset.tool;$$('#dTools button').forEach(x=>x.classList.toggle('on',x===b))};
  $$('.sw').forEach(s=>s.onclick=()=>{DE.color=s.dataset.col;$$('.sw').forEach(x=>x.classList.toggle('on',x===s))});
  $('#dUndo').onclick=()=>{DE.shapes.pop();drawDE()};$('#dClear').onclick=()=>{DE.shapes=[];drawDE()};
  let seekBusy=false;$('#dT').oninput=async e=>{DE.t=+e.target.value;lbl();if(seekBusy)return;seekBusy=true;await seekTo(DE.v,DE.t);seekBusy=false;if(Math.abs(DE.v.currentTime-DE.t)>0.05)await seekTo(DE.v,DE.t);drawDE()};
  $('#dD').oninput=e=>{DE.dur=+e.target.value;lbl()};$('#dZ').oninput=e=>{DE.zoom=+e.target.value;lbl();drawDE()};
  $('#dCancel').onclick=closeDraw;
  $('#dSave').onclick=()=>{const m=DE.m;m.freeze={t:r4(DE.t),dur:DE.dur,zoom:DE.zoom,zx:r4(DE.zx),zy:r4(DE.zy),shapes:DE.shapes};closeDraw();persist();renderMoments();idleSoon();if(SM===m)openSheet(m.id)};
}
function closeDraw(){$('#draw').classList.remove('on');if(DE){DE.v.remove();DE=null}}
function sizeDC(){if(!DE)return;const cv=$('#dc'),box=$('#dcBox');const vw=DE.v.videoWidth||16,vh=DE.v.videoHeight||9;const bw=box.clientWidth-12,bh=box.clientHeight-12;const s=Math.min(bw/vw,bh/vh);
  cv.style.width=Math.floor(vw*s)+'px';cv.style.height=Math.floor(vh*s)+'px';const dpr=Math.min(2,devicePixelRatio||1);cv.width=Math.round(vw*s*dpr);cv.height=Math.round(vh*s*dpr)}
function drawDE(){if(!DE)return;const cv=$('#dc'),x=cv.getContext('2d');const W=cv.width,H=cv.height;
  try{x.drawImage(DE.v,0,0,W,H)}catch(e){x.fillStyle='#111';x.fillRect(0,0,W,H)}
  if(DE.zoom>1.01){const rw=W/DE.zoom,rh=H/DE.zoom;const rx=clamp(DE.zx*W-rw/2,0,W-rw),ry=clamp(DE.zy*H-rh/2,0,H-rh);x.save();x.setLineDash([10,7]);x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=2;x.strokeRect(rx,ry,rw,rh);x.restore()}
  const tr={ox:0,oy:0,sx:W,sy:H};const U=Math.min(W,H);
  (DE.cur?DE.shapes.concat([DE.cur]):DE.shapes).slice().sort((a,b)=>(b.t==='spot')-(a.t==='spot')).forEach(s=>drawShape(x,s,tr,1,U));
  const px=DE.zx*W,py=DE.zy*H;x.save();x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.arc(px,py,U*0.025,0,Math.PI*2);x.moveTo(px-U*0.045,py);x.lineTo(px+U*0.045,py);x.moveTo(px,py-U*0.045);x.lineTo(px,py+U*0.045);x.stroke();x.restore()}
(function(){const cv=$('#dc');const pt=e=>{const r=cv.getBoundingClientRect();return[r4(clamp((e.clientX-r.left)/r.width,0,1)),r4(clamp((e.clientY-r.top)/r.height,0,1))]};
  cv.addEventListener('pointerdown',e=>{if(!DE)return;e.preventDefault();const p=pt(e);if(DE.tool==='zoom'){DE.zx=p[0];DE.zy=p[1];if(DE.zoom<1.2){DE.zoom=1.6;$('#dZ').value=1.6;$('#dZl').textContent='1.6×'}drawDE();return}DE.cur={t:DE.tool,c:DE.color,p:[p,p]};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener('pointermove',e=>{if(!DE||!DE.cur)return;const p=pt(e);if(DE.cur.t==='pen'){const l=DE.cur.p[DE.cur.p.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])>0.004)DE.cur.p.push(p)}else DE.cur.p[1]=p;drawDE()});
  const up=()=>{if(!DE||!DE.cur)return;const s=DE.cur;DE.cur=null;const a=s.p[0],b=s.p[s.p.length-1];if(Math.hypot(b[0]-a[0],b[1]-a[1])>0.015||(s.t==='pen'&&s.p.length>3))DE.shapes.push(s);drawDE()};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up)})();

/* ================= events ================= */
document.addEventListener('click',e=>{
  const tb=e.target.closest('#tabs button');if(tb){showTab(tb.dataset.tab);return}
  const sg=e.target.closest('.seg[data-seg] button');
  if(sg&&!sg.parentElement.dataset.seg.startsWith('m:')){const key=sg.parentElement.dataset.seg;const raw=sg.dataset.v;S.cfg[key]=isNaN(+raw)?raw:+raw;
    sg.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===sg));persist();renderMoments();idleSoon();return}
  const dc=e.target.closest('[data-delclip]');if(dc){e.stopPropagation();delClip(dc.dataset.delclip);return}
  const cl=e.target.closest('.clip[data-cid]');if(cl){selectClip(cl.dataset.cid);showTab('moments');return}
  const pk=e.target.closest('[data-pick]');if(pk){selectClip(pk.dataset.pick);return}
  const pl=e.target.closest('[data-play]');if(pl){preview(pl.dataset.play);return}
  const ed=e.target.closest('[data-edit]');if(ed){openSheet(ed.dataset.edit);return}
  const mo=e.target.closest('.mom[data-mid]');if(mo){openSheet(mo.dataset.mid);return}
  if(e.target.id==='sheet')closeSheet();
});
document.addEventListener('input',e=>{const el=e.target;const k=el.dataset&&el.dataset.cfg;if(!k)return;
  S.cfg[k]=el.type==='checkbox'?el.checked:(el.type==='number'||el.type==='range')?(+el.value||0):el.value;persist();idleSoon();if(k==='musicVol'&&music&&music._g&&run)music._g.gain.value=S.cfg.musicVol});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.cfg&&e.target.type==='checkbox'){renderMoments()}});
$('#fVideo').onchange=e=>{const f=[...e.target.files];e.target.value='';if(f.length)addFiles(f)};
$('#fMusic').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(music){music.pause();music.remove()}music=document.createElement('audio');music.src=URL.createObjectURL(f);music.loop=true;music.preload='auto';$('#bin').appendChild(music);musicName=f.name;routeAudio(music);setG(music,0);renderMusic()};
$('#fLogo').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const i=new Image();i.onload=()=>{const s=Math.min(1,320/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);S.cfg.logo=c.toDataURL('image/png');loadLogo();persist();renderPanels();showTab('board')};i.src=URL.createObjectURL(f)};
$('#playBtn').onclick=()=>preview();
$('#lang').value=lang;$('#lang').onchange=e=>{lang=e.target.value;save('lang',lang);renderPanels();idleSoon()};
window.addEventListener('resize',()=>{if(DE){sizeDC();drawDE()}});
// drag & drop (desktop)
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{e.preventDefault();const f=[...(e.dataTransfer.files||[])];if(f.length)addFiles(f)});

loadLogo();renderPanels();showTab('clips');idleSoon();
</script>
